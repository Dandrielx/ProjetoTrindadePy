<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <style>
        body {
            padding: 0;
            margin: 0;
            color: #ccc;
            background-color: #333;
        }

        html,
        body,
        #map {
            height: 100%;
            width: 100vw;
        }

        .leaflet-container.dark {
            background: #2a2a2a;
        }

        .dark .leaflet-popup-content-wrapper,
        .dark .leaflet-popup-tip {
            background-color: #1c1c1c;
            color: #eee;
        }

        .dark .leaflet-control-zoom a,
        .dark .leaflet-control-attribution {
            background-color: #2c2c2c;
            color: #ccc;
        }

        .dark .leaflet-control-attribution a {
            color: #aaa;
        }
        .crosshair-cursor {
            cursor: crosshair !important;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script>
        // --- Ponte de Depuração para o React Native ---
        const postMessage = (type, payload) => {
            const message = JSON.stringify({ type, payload });
            if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
                window.ReactNativeWebView.postMessage(message);
            }
        };

        // Redireciona console.log e erros para o React Native
        console.log = (...args) => postMessage('log', args);
        window.onerror = (message, source, lineno, colno, error) => {
            postMessage('error', { message, source, lineno, colno, error: error ? error.stack : 'N/A' });
        };

        // --- Lógica do Mapa ---
        let map, tileLayer, heatLayer, markerLayer;

        function setHeatmapVisible(visible) {
            if (!map || !heatLayer) return;
            if (visible && !map.hasLayer(heatLayer)) map.addLayer(heatLayer);
            if (!visible && map.hasLayer(heatLayer)) map.removeLayer(heatLayer);
        }

        function setMarkersVisible(visible) {
            if (!map || !markerLayer) return;
            if (visible && !map.hasLayer(markerLayer)) map.addLayer(markerLayer);
            if (!visible && map.hasLayer(markerLayer)) map.removeLayer(markerLayer);
        }

        function setTheme(theme) {
            if (!map || !tileLayer) return;
            let tileUrl;
            if (theme === 'dark') {
                tileUrl = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
                L.DomUtil.addClass(map.getContainer(), 'dark');
            } else {
                tileUrl = 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
                L.DomUtil.removeClass(map.getContainer(), 'dark');
            }
            tileLayer.setUrl(tileUrl);
        }

        function toggleAddMarkerMode(enable) {
                if (!map) return;
                if (enable) {
                    // Ativa o modo: muda o cursor e adiciona um listener de clique
                    L.DomUtil.addClass(map.getContainer(), 'crosshair-cursor');
                    map.on('click', onMapClick);
                } else {
                    // Desativa o modo: volta ao cursor normal e remove o listener
                    L.DomUtil.removeClass(map.getContainer(), 'crosshair-cursor');
                    map.off('click', onMapClick);
                }
            }

        function onMapClick(e) {
            // Quando o mapa é clicado, envia as coordenadas para o React Native
            const coords = e.latlng;
            postMessage('marker_added', { lat: coords.lat, lng: coords.lng });
            // Desativa o modo de adição após um clique para evitar múltiplos marcadores
            toggleAddMarkerMode(false);
        }

        // Função principal de inicialização
        function init(initialData) {
            try {
                console.log("Iniciando mapa com dados...");
                const { userCoords, pollutionPoints } = initialData;

                map = L.map('map', { zoomControl: false }).setView([userCoords.latitude, userCoords.longitude], 13);
                L.control.zoom({ position: 'topright' }).addTo(map);

                tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                    maxZoom: 20, attribution: '&copy; OpenStreetMap &copy; CARTO'
                }).addTo(map);

                const heatData = pollutionPoints.map(p => [p.lat, p.lng, p.intensity / 5]);
                heatLayer = L.heatLayer(heatData, {
                    radius: 70, blur: 35, maxZoom: 18, max: 1.0,
                    gradient: { 0.3: 'blue', 0.5: 'lime', 0.7: 'yellow', 1.0: 'red' }
                });

                markerLayer = L.layerGroup();
                pollutionPoints.forEach(point => {
                    let markerColor = 'lightblue';
                    if (point.type === 'oil') markerColor = 'black';
                    if (point.type === 'garbage') markerColor = 'brown';
                    const svgIcon = L.divIcon({
                        html: `<svg height="20" width="20"><circle cx="10" cy="10" r="8" stroke="white" stroke-width="2" fill="${markerColor}" /></svg>`,
                        className: '', iconSize: [20, 20], iconAnchor: [10, 10]
                    });
                    const marker = L.marker([point.lat, point.lng], { icon: svgIcon });
                    marker.bindPopup(`<b>Tipo:</b> ${point.type}<br><b>Intensidade:</b> ${point.intensity}/10`);
                    markerLayer.addLayer(marker);
                });

                L.marker([userCoords.latitude, userCoords.longitude]).addTo(map).bindPopup('Você está aqui!');

                postMessage('init_success', 'Mapa inicializado com sucesso.');

            } catch (e) {
                console.log("ERRO na inicialização do mapa:", e.message, e.stack);
            }
        }
    </script>
</body>

</html>
