<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <style>
        body {
            padding: 0;
            margin: 0;
        }

        html,
        body,
        #map {
            height: 100%;
            width: 100vw;
        }

        .leaflet-container.dark {
            background: #2a2a2a;
        }

        .dark .leaflet-popup-content-wrapper,
        .dark .leaflet-popup-tip {
            background-color: #1c1c1c;
            color: #eee;
        }

        .crosshair-cursor {
            cursor: crosshair !important;
        }

        /* Estilos do Popup Personalizado */
        .popup-container {
            min-width: 180px;
            max-width: 240px;
            font-family: sans-serif;
        }

        .popup-image {
            width: 100%;
            height: 130px;
            border-radius: 8px;
            object-fit: cover;
            margin-bottom: 8px;
            background-color: #f0f0f0;
            display: block;
        }

        .popup-title {
            font-size: 14px;
            font-weight: bold;
            color: #2E7D32;
            text-transform: uppercase;
            display: block;
            margin-bottom: 4px;
        }

        .popup-info {
            font-size: 12px;
            color: #444;
            line-height: 1.4;
        }

        .popup-divider {
            border: 0;
            border-top: 1px solid #EEE;
            margin: 8px 0;
        }

        .popup-tech-row {
            margin-top: 4px;
            font-size: 11px;
            color: #333;
            border-left: 3px solid #81C784;
            padding-left: 5px;
        }

        .edit-btn {
            background-color: #81C784;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 10px;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <script>
        let map, tileLayer, heatLayer, markerLayer;
        let BASE_URL = "";

        const postMessage = (type, payload) => {
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(JSON.stringify({ type, payload }));
            }
        };

        window.editMarker = (markerData) => {
            postMessage('edit_marker_request', markerData);
        };

        // --- FUNÇÕES DE VISIBILIDADE (Necessárias para os filtros do App funcionarem) ---
        function setHeatmapVisible(visible) {
            if (map && heatLayer) {
                if (visible) map.addLayer(heatLayer);
                else map.removeLayer(heatLayer);
            }
        }
        function setMarkersVisible(visible) {
            if (map && markerLayer) {
                if (visible) map.addLayer(markerLayer);
                else map.removeLayer(markerLayer);
            }
        }

        function setTheme(theme) {
            const mapContainer = document.getElementById('map');
            if (theme === 'dark') {
                mapContainer.classList.add('dark');
                tileLayer.setUrl('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png');
            } else {
                mapContainer.classList.remove('dark');
                tileLayer.setUrl('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png');
            }
        }

        function toggleAddMarkerMode(enable) {
            const mapContainer = document.getElementById('map');
            if (enable) {
                mapContainer.classList.add('crosshair-cursor');
                map.on('click', (e) => postMessage('marker_added', e.latlng));
            } else {
                mapContainer.classList.remove('crosshair-cursor');
                map.off('click');
            }
        }

        function init(initialData) {
            try {
                const { userCoords, pollutionPoints, showHeatmap, showMarkers, apiBaseUrl } = initialData;
                BASE_URL = apiBaseUrl;

                if (!map) {
                    map = L.map('map', { zoomControl: false }).setView([userCoords.latitude, userCoords.longitude], 13);
                    tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 20 }).addTo(map);
                    L.marker([userCoords.latitude, userCoords.longitude]).addTo(map).bindPopup('Você está aqui!');
                }

                // Limpa camadas existentes antes de recriar
                if (heatLayer) map.removeLayer(heatLayer);
                if (markerLayer) map.removeLayer(markerLayer);

                // Configuração Heatmap
                const heatData = pollutionPoints.map(p => [p.lat, p.lng, (p.projeto !== 'comunitario' ? 5 : p.intensity) / 2]);
                heatLayer = L.heatLayer(heatData, { radius: 70, blur: 35, maxZoom: 18 });

                markerLayer = L.layerGroup();
                pollutionPoints.forEach(point => {
                    let markerColor = '#81C784';
                    if (point.projeto === 'maranhao') markerColor = '#FFA500';
                    else if (point.projeto === 'trindade') markerColor = '#000080';
                    else if (point.type === 'oleo') markerColor = 'black';

                    const svgIcon = L.divIcon({
                        html: `<svg height="22" width="22"><circle cx="11" cy="11" r="9" stroke="white" stroke-width="2" fill="${markerColor}" /></svg>`,
                        className: '', iconSize: [22, 22], iconAnchor: [11, 11]
                    });

                    const marker = L.marker([point.lat, point.lng], { icon: svgIcon });

                    let popupHtml = `<div class="popup-container">`;

                    // Foto
                    if (point.image_url) {
                        const fullImgUrl = point.image_url.startsWith('http') ? point.image_url : `${BASE_URL}${point.image_url}`;
                        popupHtml += `<img src="${fullImgUrl}" class="popup-image" onerror="this.style.display='none'" />`;
                    }

                    popupHtml += `<span class="popup-title">${point.projeto.toUpperCase()}</span>`;
                    popupHtml += `<div class="popup-info">`;

                    if (point.projeto === 'comunitario') {
                        popupHtml += `<b>Tipo:</b> ${point.type}<br>`;
                        popupHtml += `<b>Intensidade:</b> ${point.intensity}/10<br>`;
                    }

                    if (point.description) {
                        popupHtml += `<hr class="popup-divider"><i>"${point.description}"</i>`;
                    }

                    // DADOS TÉCNICOS (Puxando de marcacoes_detalhes)
                    if (point.detalhes && point.detalhes.length > 0) {
                        popupHtml += `<hr class="popup-divider"><b>DADOS DA PESQUISA:</b>`;
                        point.detalhes.forEach(det => {
                            // Exibe chave e valor um abaixo do outro
                            popupHtml += `<div class="popup-tech-row"><b>${det.chave.toUpperCase()}:</b> ${det.valor}</div>`;
                        });
                    }

                    popupHtml += `</div>`;
                    const pointJson = JSON.stringify(point).replace(/"/g, '&quot;');
                    popupHtml += `<button class="edit-btn" onclick="window.editMarker(${pointJson})">Editar Dados</button></div>`;

                    marker.bindPopup(popupHtml);
                    markerLayer.addLayer(marker);
                });

                // Aplica visibilidade inicial baseada nos filtros
                if (showHeatmap) map.addLayer(heatLayer);
                if (showMarkers) map.addLayer(markerLayer);

            } catch (e) { console.log("Erro HTML:", e.message); }
        }
    </script>
</body>

</html>
