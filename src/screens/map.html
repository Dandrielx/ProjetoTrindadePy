<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <style>
        body {
            padding: 0;
            margin: 0;
        }

        html,
        body,
        #map {
            height: 100%;
            width: 100vw;
        }

        .leaflet-container.dark {
            background: #2a2a2a;
        }

        .dark .leaflet-popup-content-wrapper,
        .dark .leaflet-popup-tip {
            background-color: #1c1c1c;
            color: #eee;
        }

        .crosshair-cursor {
            cursor: crosshair !important;
        }

        .popup-container {
            min-width: 180px;
            max-width: 240px;
            font-family: sans-serif;
        }

        .popup-image {
            width: 100%;
            height: 130px;
            border-radius: 8px;
            object-fit: cover;
            margin-bottom: 8px;
            background-color: #f0f0f0;
            display: block;
        }

        .popup-info {
            font-size: 12px;
            color: #444;
            line-height: 1.4;
        }

        .popup-divider {
            border: 0;
            border-top: 1px solid #EEE;
            margin: 8px 0;
        }

        .popup-tech-row {
            margin-top: 4px;
            font-size: 11px;
            color: #333;
            border-left: 3px solid #81C784;
            padding-left: 5px;
        }

        .edit-btn {
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 10px;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <script>
        let map, tileLayer, heatLayer, markerLayer;
        let BASE_URL = "";
        let currentIndices = {};
        let markers = {};
        let pollutionPoints = [];

        const postMessage = (type, payload) => {
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(JSON.stringify({ type, payload }));
            }
        };

        window.editMarker = (data) => postMessage('edit_marker_request', data);

        window.addColeta = (id) => {
            const point = pollutionPoints.find(p => p.id === id);
            postMessage('add_coleta_request', point);
        };

        window.changeColeta = (pointId, delta) => {
            const point = pollutionPoints.find(p => p.id === pointId);
            let newIndex = (currentIndices[pointId] || 0) + delta;
            if (newIndex >= 0 && newIndex < point.coletas.length) {
                currentIndices[pointId] = newIndex;
                markers[pointId].getPopup().setContent(updatePopupContent(pointId));
            }
        };

        function updatePopupContent(pointId) {
            const point = pollutionPoints.find(p => p.id === pointId);
            const index = currentIndices[pointId] || 0;
            const coleta = point.coletas[index];
            const total = point.coletas.length;

            let html = `<div class="popup-container">`;

            if (total > 1) {
                html += `
                    <button onclick="event.stopPropagation(); window.changeColeta(${point.id}, 1)" ...>◀</button>
                    <span ...>COLETA ${total - index} de ${total}</span>
                    <button onclick="event.stopPropagation(); window.changeColeta(${point.id}, -1)" ...>▶</button>
                `;
            }

            if (coleta.image_url) {
                const fullImgUrl = coleta.image_url.startsWith('http') ? coleta.image_url : `${BASE_URL}${coleta.image_url}`;
                html += `<img src="${fullImgUrl}" class="popup-image" onerror="this.style.display='none'" />`;
            }

            html += `<div class="popup-info">`;
            html += `<span style="font-size:10px; color:#999;">${new Date(coleta.data).toLocaleDateString()}</span><br>`;
            html += `<b>PROJETO:</b> ${point.projeto.toUpperCase()}<br>`;
            html += `<b>TIPO:</b> ${coleta.type.toUpperCase()}<br>`;

            if (point.projeto === 'comunitario') {
                html += `<b>INTENSIDADE:</b> ${coleta.intensity}/10<br>`;
            }

            if (coleta.description) {
                html += `<hr class="popup-divider"><i>"${coleta.description}"</i>`;
            }

            if (coleta.detalhes && coleta.detalhes.length > 0) {
                html += `<hr class="popup-divider"><b>DADOS TÉCNICOS:</b>`;
                coleta.detalhes.forEach(det => {
                    html += `<div class="popup-tech-row"><b>${det.chave.toUpperCase()}:</b> ${det.valor}</div>`;
                });
            }
            html += `</div>`;

            const editData = JSON.stringify({ ...point, ...coleta, detalhes: coleta.detalhes }).replace(/"/g, '&quot;');
            html += `
            <div style="display:flex; gap:5px; margin-top:10px;">
                <button class="edit-btn" style="flex:1; background-color:#81C784;" onclick='window.editMarker(${editData})'>Editar</button>
                <button class="edit-btn" style="flex:1; background-color:#2E7D32" onclick="window.addColeta(${point.id})">+ Coleta</button>
            </div></div>`;

            return html;
        }

        function setHeatmapVisible(v) { if (map && heatLayer) v ? map.addLayer(heatLayer) : map.removeLayer(heatLayer); }
        function setMarkersVisible(v) { if (map && markerLayer) v ? map.addLayer(markerLayer) : map.removeLayer(markerLayer); }
        function setTheme(t) {
            const c = document.getElementById('map');
            if (t === 'dark') { c.classList.add('dark'); tileLayer.setUrl('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'); }
            else { c.classList.remove('dark'); tileLayer.setUrl('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png'); }
        }

        function toggleAddMarkerMode(e) {
            if (e) { document.getElementById('map').classList.add('crosshair-cursor'); map.on('click', (ev) => postMessage('marker_added', ev.latlng)); }
            else { document.getElementById('map').classList.remove('crosshair-cursor'); map.off('click'); }
        }

        function init(initialData) {
            try {
                const { userCoords, pollutionPoints: data, showHeatmap, showMarkers, apiBaseUrl } = initialData;
                BASE_URL = apiBaseUrl;
                pollutionPoints = data;

                if (!map) {
                    map = L.map('map', { zoomControl: false }).setView([userCoords.latitude, userCoords.longitude], 13);
                    tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
                }

                if (heatLayer) map.removeLayer(heatLayer);
                if (markerLayer) map.removeLayer(markerLayer);

                const heatData = pollutionPoints.map(p => [p.lat, p.lng, (p.coletas[0]?.intensity || 5) / 2]);
                heatLayer = L.heatLayer(heatData, { radius: 70, blur: 35 });

                markerLayer = L.layerGroup();
                pollutionPoints.forEach(point => {
                    currentIndices[point.id] = 0;
                    const ultima = point.coletas[0];
                    let color = '#81C784';
                    if (point.projeto === 'maranhao') color = '#FFA500';
                    else if (point.projeto === 'trindade') color = '#000080';
                    else if (ultima?.type === 'oleo') color = 'black';
                    else if (ultima?.type === 'plastico') color = 'red';

                    const icon = L.divIcon({
                        html: `<svg height="22" width="22"><circle cx="11" cy="11" r="9" stroke="white" stroke-width="2" fill="${color}" /></svg>`,
                        className: '', iconSize: [22, 22], iconAnchor: [11, 11]
                    });

                    const m = L.marker([point.lat, point.lng], { icon: icon });
                    markers[point.id] = m;
                    m.bindPopup(() => updatePopupContent(point.id), {
                        closeOnClick: false, // O popup não fecha se clicar no mapa
                        autoPan: true
                    });
                    markerLayer.addLayer(m);
                });

                if (showHeatmap) map.addLayer(heatLayer);
                if (showMarkers) map.addLayer(markerLayer);
            } catch (e) { console.log("Erro Init:", e.message); }
        }
    </script>
</body>

</html>
