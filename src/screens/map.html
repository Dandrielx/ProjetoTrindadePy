<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <style>
        body {
            padding: 0;
            margin: 0;
        }

        html,
        body,
        #map {
            height: 100%;
            width: 100vw;
        }

        .leaflet-container.dark {
            background: #2a2a2a;
        }

        .dark .leaflet-popup-content-wrapper,
        .dark .leaflet-popup-tip {
            background-color: #1c1c1c;
            color: #eee;
        }

        .dark .leaflet-control-zoom a,
        .dark .leaflet-control-attribution {
            background-color: #2c2c2c;
            color: #ccc;
        }

        .dark .leaflet-control-attribution a {
            color: #aaa;
        }

        .crosshair-cursor {
            cursor: crosshair !important;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <script>
        let map, tileLayer, heatLayer, markerLayer;
        const postMessage = (type, payload) => {
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(JSON.stringify({ type, payload }));
            }
        };
        console.log = (...args) => postMessage('log', args);
        window.onerror = (message, source, lineno, colno, error) => {
            postMessage('error', { message, source, lineno, colno, error: error ? error.stack : 'N/A' });
        };

        function setHeatmapVisible(visible) { if (map && heatLayer) { if (visible && !map.hasLayer(heatLayer)) map.addLayer(heatLayer); if (!visible && map.hasLayer(heatLayer)) map.removeLayer(heatLayer); } }
        function setMarkersVisible(visible) { if (map && markerLayer) { if (visible && !map.hasLayer(markerLayer)) map.addLayer(markerLayer); if (!visible && map.hasLayer(markerLayer)) map.removeLayer(markerLayer); } }

        // Função de Tema
        function setTheme(theme) {
            const mapContainer = document.getElementById('map');
            if (theme === 'dark') {
                mapContainer.classList.add('dark');
                tileLayer.setUrl('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png');
            } else {
                mapContainer.classList.remove('dark');
                tileLayer.setUrl('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png');
            }
        }

        // Função para ligar/desligar o modo de adição de marcador
        function toggleAddMarkerMode(enable) {
            const mapContainer = document.getElementById('map');
            if (enable) {
                mapContainer.classList.add('crosshair-cursor');
                map.on('click', onMapClick);
            } else {
                mapContainer.classList.remove('crosshair-cursor');
                map.off('click', onMapClick);
            }
        }

        // Função chamada quando o mapa é clicado no modo de adição
        function onMapClick(e) {
            postMessage('marker_added', e.latlng);
        }


        function init(initialData) {
            try {
                const { userCoords, pollutionPoints, showHeatmap, showMarkers } = initialData;

                if (!map) {
                    map = L.map('map', { zoomControl: false }).setView([userCoords.latitude, userCoords.longitude], 13);
                    L.control.zoom({ position: 'topright' }).addTo(map);
                    tileLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { maxZoom: 20, attribution: '&copy; OpenStreetMap &copy; CARTO' }).addTo(map);
                    L.marker([userCoords.latitude, userCoords.longitude]).addTo(map).bindPopup('Você está aqui!');
                }

                if (heatLayer) map.removeLayer(heatLayer);
                if (markerLayer) map.removeLayer(markerLayer);

                const heatData = pollutionPoints.map(p => [p.lat, p.lng, p.intensity / 2]);
                heatLayer = L.heatLayer(heatData, {
                    radius: 70, blur: 35, maxZoom: 18, max: 1.0,
                    gradient: { 0.3: 'blue', 0.5: 'lime', 0.7: 'yellow', 1.0: 'red' }
                });

                markerLayer = L.layerGroup();
                pollutionPoints.forEach(point => {
                    let markerColor = 'red';
                    if (point.type === 'oil') markerColor = 'black';
                    if (point.type === 'garbage') markerColor = 'brown';
                    const svgIcon = L.divIcon({ html: `<svg height="20" width="20"><circle cx="10" cy="10" r="8" stroke="white" stroke-width="2" fill="${markerColor}" /></svg>`, className: '', iconSize: [20, 20], iconAnchor: [10, 10] });
                    const marker = L.marker([point.lat, point.lng], { icon: svgIcon });
                    marker.bindPopup(`<b>Tipo:</b> ${point.type}<br><b>Intensidade:</b> ${point.intensity}/10`);
                    markerLayer.addLayer(marker);
                });

                // Adiciona as camadas ao mapa
                if (showHeatmap) {
                    map.addLayer(heatLayer);
                }
                if (showMarkers) {
                    map.addLayer(markerLayer);
                }

                postMessage('init_success', `Mapa atualizado com ${pollutionPoints.length} pontos.`);
            } catch (e) {
                console.log("ERRO na inicialização do mapa:", e.message, e.stack);
            }
        }
    </script>
</body>

</html>
